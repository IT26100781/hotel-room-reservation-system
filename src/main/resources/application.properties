spring.application.name=payment-billing
spring.profiles.default=demo
server.port=8080
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
payment.file=${PAYMENT_FILE:./data/payments.txt}
# The brief does not specify a percentage. 5% is an adjustable example.
payment.cash-discount-rate=${CASH_DISCOUNT_RATE:0.05}
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
