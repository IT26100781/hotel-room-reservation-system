spring.application.name=hotel-reservation

# JSP views live in src/main/webapp/WEB-INF/views/<component>/<page>.jsp
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# database setup
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/hotel_reservation?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.sql.init.mode=always

# One table file per component, run in this order (tables with foreign keys come after the tables they reference)
spring.sql.init.schema-locations=\
  classpath:db/01-staff.sql,\
  classpath:db/02-guests.sql,\
  classpath:db/03-rooms.sql,\
  classpath:db/04-bookings.sql,\
  classpath:db/05-payments.sql,\
  classpath:db/06-reviews.sql
