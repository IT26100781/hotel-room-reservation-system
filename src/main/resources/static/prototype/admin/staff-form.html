<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add staff · Staff portal · The Orchid Estate</title>
  <link rel="icon" href="../../img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../js/tailwind.config.js"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../../css/theme.css">
</head>
<!-- Owner: Admin/Staff component. Same page for Add and Edit. Role decides the class created: Staff or Admin. -->
<body data-root="../" data-layout="staff" data-active="staff" data-user="admin">
  <div data-slot="sidebar"></div>
  <div class="lg:pl-72 min-h-screen">
    <div data-slot="topbar"></div>
    <main class="px-4 sm:px-8 py-8 max-w-4xl">
      <a href="staff.html" class="text-sm text-muted hover:text-forest inline-flex items-center gap-1.5"><i data-lucide="arrow-left" class="w-4 h-4"></i>Back to staff</a>
      <h1 class="font-display text-4xl sm:text-5xl font-semibold text-forest mt-3">Add a staff member</h1>
      <p class="text-muted mt-2">They'll use these details to sign in to the staff portal.</p>

      <!-- JSP: action="${pageContext.request.contextPath}/admin/staff/save" method="post" -->
      <form class="card card-pad mt-8 space-y-8" data-demo="Staff member saved (prototype)" data-next="staff.html">
        <div class="grid sm:grid-cols-2 gap-5">
          <div><label class="label" for="name">Full name</label><div class="input-icon"><i data-lucide="user"></i><input id="name" name="name" class="input" required></div></div>
          <div><label class="label" for="email">Work email</label><div class="input-icon"><i data-lucide="mail"></i><input id="email" name="email" type="email" class="input" placeholder="name@orchidestate.lk" required></div></div>
          <div>
            <label class="label" for="password">Temporary password</label>
            <div class="input-icon"><i data-lucide="lock"></i><input id="password" name="password" type="password" class="input" minlength="8" autocomplete="new-password" required></div>
            <p class="hint">Ask them to change it after their first sign-in.</p>
          </div>
          <div>
            <label class="label" for="status">Status</label>
            <select id="status" name="status" class="select"><option value="active">Active</option><option value="inactive">Inactive</option></select>
          </div>
        </div>

        <fieldset>
          <legend class="label">Role</legend>
          <div class="grid sm:grid-cols-2 gap-3">
            <label class="choice">
              <input type="radio" name="role" value="STAFF" checked>
              <span class="choice-body block">
                <span class="flex items-center justify-between"><span class="badge badge-staff no-dot"><i data-lucide="concierge-bell"></i>Staff</span></span>
                <span class="block text-sm text-ink/70 mt-3">Front desk: check-in, payments, bookings and guest VIP status.</span>
              </span>
            </label>
            <label class="choice">
              <input type="radio" name="role" value="ADMIN">
              <span class="choice-body block">
                <span class="flex items-center justify-between"><span class="badge badge-admin no-dot"><i data-lucide="shield-check"></i>Admin</span></span>
                <span class="block text-sm text-ink/70 mt-3">Everything Staff can do, plus rooms, staff accounts and reviews.</span>
              </span>
            </label>
          </div>
        </fieldset>

        <div class="flex justify-end gap-2 pt-2 border-t border-line">
          <a href="staff.html" class="btn btn-ghost">Cancel</a>
          <button type="submit" class="btn btn-primary"><i data-lucide="check"></i>Save staff member</button>
        </div>
      </form>
    </main>
  </div>

  <script src="../../js/layout.js"></script>
  <script src="../../js/app.js"></script>
</body>
</html>
