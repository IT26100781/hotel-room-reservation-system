<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Write a review · The Orchid Estate</title>
  <link rel="icon" href="../../img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../js/tailwind.config.js"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../../css/theme.css">
</head>
<!-- Owner: Review component. Reads bookings.txt (read-only) to confirm the stay is completed and belongs
     to the logged-in guest; if so it is saved as a VerifiedReview. Strip "|" from the text before saving. -->
<body data-root="../" data-layout="public" data-active="bookings" data-user="guest">
  <div data-slot="header"></div>

  <main class="mx-auto max-w-5xl px-4 sm:px-6 lg:px-8 pt-12">
    <a href="../reservation/my-bookings.html" class="text-sm text-muted hover:text-forest inline-flex items-center gap-1.5"><i data-lucide="arrow-left" class="w-4 h-4"></i>Back to my bookings</a>

    <div class="mt-6 grid lg:grid-cols-[320px_1fr] gap-10 items-start">
      <!-- The stay being reviewed -->
      <aside class="card overflow-hidden lg:sticky lg:top-28">
        <div class="arch-sm h-56 m-3 mb-0"><img class="img-cover" src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=700&q=80" alt="Deluxe Garden Room"></div>
        <div class="p-5">
          <p class="mono text-xs text-muted">BK0987</p>
          <h2 class="font-display text-2xl font-semibold text-forest">Deluxe Garden Room</h2>
          <p class="text-sm text-muted mt-1">2 – 5 Sep 2026 · 3 nights</p>
          <span class="badge badge-verified no-dot mt-4"><i data-lucide="badge-check"></i>Will be posted as verified</span>
        </div>
      </aside>

      <!-- JSP: action="${pageContext.request.contextPath}/reviews" method="post" -->
      <form class="card card-pad" data-demo="Thank you, your review is posted (prototype)" data-next="list.html">
        <input type="hidden" name="bookingId" value="BK0987">
        <span class="eyebrow">Your review</span>
        <h1 class="font-display text-4xl sm:text-5xl font-semibold text-forest mt-3">How was your stay, Nethmi?</h1>

        <fieldset class="mt-8">
          <legend class="label">Overall rating</legend>
          <div class="flex flex-wrap items-center gap-4">
            <div class="star-input">
              <input type="radio" id="r5" name="rating" value="5" required><label for="r5" title="Exceptional"><i data-star></i></label>
              <input type="radio" id="r4" name="rating" value="4"><label for="r4" title="Very good"><i data-star></i></label>
              <input type="radio" id="r3" name="rating" value="3"><label for="r3" title="Good"><i data-star></i></label>
              <input type="radio" id="r2" name="rating" value="2"><label for="r2" title="Fair"><i data-star></i></label>
              <input type="radio" id="r1" name="rating" value="1"><label for="r1" title="Poor"><i data-star></i></label>
            </div>
            <span class="font-display text-2xl italic text-brass" data-rating-text></span>
          </div>
        </fieldset>

        <div class="mt-8">
          <label class="label" for="text">Tell other guests about it</label>
          <textarea id="text" name="text" class="textarea" maxlength="500" required data-counter="#text-count"
                    placeholder="What did you love? What could be better?"></textarea>
          <div class="flex justify-between hint"><span>Be kind and specific. It helps other travellers.</span><span id="text-count"></span></div>
        </div>

        <div class="mt-8 pt-6 border-t border-line flex flex-wrap justify-end gap-2">
          <a href="../reservation/my-bookings.html" class="btn btn-ghost">Cancel</a>
          <button type="submit" class="btn btn-primary"><i data-lucide="send"></i>Post review</button>
        </div>
      </form>
    </div>
  </main>

  <div data-slot="footer"></div>
  <script src="../../js/layout.js"></script>
  <script src="../../js/app.js"></script>
</body>
</html>
