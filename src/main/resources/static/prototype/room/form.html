<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add room · Staff portal · The Orchid Estate</title>
  <link rel="icon" href="../../img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../js/tailwind.config.js"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../../css/theme.css">
</head>
<!-- Owner: Room component. Same page is used for Add and Edit (pre-fill fields when editing). -->
<body data-root="../" data-layout="staff" data-active="rooms" data-user="admin">
  <div data-slot="sidebar"></div>
  <div class="lg:pl-72 min-h-screen">
    <div data-slot="topbar"></div>
    <main class="px-4 sm:px-8 py-8 max-w-6xl">
      <a href="manage.html" class="text-sm text-muted hover:text-forest inline-flex items-center gap-1.5"><i data-lucide="arrow-left" class="w-4 h-4"></i>Back to rooms</a>
      <h1 class="font-display text-4xl sm:text-5xl font-semibold text-forest mt-3">Add a room</h1>
      <p class="text-muted mt-2">The room ID is generated automatically when you save.</p>

      <div class="mt-8 grid lg:grid-cols-[1fr_340px] gap-8 items-start">
        <!-- JSP: action="${pageContext.request.contextPath}/admin/rooms/save" method="post" -->
        <form class="card card-pad space-y-8" data-demo="Room saved (prototype)" data-next="manage.html">
          <fieldset>
            <legend class="label">Room type</legend>
            <div class="grid sm:grid-cols-3 gap-3">
              <label class="choice">
                <input type="radio" name="type" value="STANDARD" data-bind="type" data-label="Standard Room" data-set="capacity=2;rate=18500"
                       data-img="https://images.unsplash.com/photo-1631049307264-da0ec9d70304?auto=format&fit=crop&w=700&q=80">
                <span class="choice-body block">
                  <i data-lucide="bed-single" class="w-6 h-6 text-brass"></i>
                  <span class="block font-semibold text-forest mt-2">Standard</span>
                  <span class="block text-xs text-muted mt-1">2 guests · basic amenities</span>
                </span>
              </label>
              <label class="choice">
                <input type="radio" name="type" value="DELUXE" data-bind="type" data-label="Deluxe Room" data-set="capacity=3;rate=28000" checked
                       data-img="https://images.unsplash.com/photo-1611892440504-42a792e24d32?auto=format&fit=crop&w=700&q=80">
                <span class="choice-body block">
                  <i data-lucide="bed-double" class="w-6 h-6 text-brass"></i>
                  <span class="block font-semibold text-forest mt-2">Deluxe</span>
                  <span class="block text-xs text-muted mt-1">3 guests · balcony, bathtub</span>
                </span>
              </label>
              <label class="choice">
                <input type="radio" name="type" value="SUITE" data-bind="type" data-label="Estate Suite" data-set="capacity=4;rate=46000"
                       data-img="https://images.unsplash.com/photo-1590490360182-c33d57733427?auto=format&fit=crop&w=700&q=80">
                <span class="choice-body block">
                  <i data-lucide="sofa" class="w-6 h-6 text-brass"></i>
                  <span class="block font-semibold text-forest mt-2">Suite</span>
                  <span class="block text-xs text-muted mt-1">4 guests · living area</span>
                </span>
              </label>
            </div>
          </fieldset>

          <div class="grid sm:grid-cols-2 gap-5">
            <div>
              <label class="label" for="roomNo">Room number</label>
              <input id="roomNo" name="roomNo" class="input" placeholder="e.g. 204" required pattern="\d{3}" data-bind="roomNo">
              <p class="hint">Three digits. First digit is the floor.</p>
            </div>
            <div>
              <label class="label" for="roomId">Room ID</label>
              <input id="roomId" class="input" value="Generated on save" readonly>
            </div>
            <div>
              <label class="label" for="rate">Rate per night (LKR)</label>
              <div class="input-icon"><i data-lucide="banknote"></i><input id="rate" name="rate" type="number" min="1000" step="500" class="input" value="28000" required data-bind="rate"></div>
            </div>
            <div>
              <label class="label" for="capacity">Capacity (guests)</label>
              <div class="input-icon"><i data-lucide="users"></i><input id="capacity" name="capacity" type="number" min="1" max="6" class="input" value="3" required data-bind="capacity"></div>
            </div>
            <div class="sm:col-span-2">
              <label class="label" for="status">Status</label>
              <select id="status" name="status" class="select">
                <option value="active">Active: bookable</option>
                <option value="maintenance">Maintenance: temporarily hidden</option>
                <option value="retired">Retired: permanently out of service</option>
              </select>
            </div>
          </div>

          <div class="flex justify-end gap-2 pt-2 border-t border-line">
            <a href="manage.html" class="btn btn-ghost">Cancel</a>
            <button type="submit" class="btn btn-primary"><i data-lucide="check"></i>Save room</button>
          </div>
        </form>

        <!-- Live preview -->
        <aside class="lg:sticky lg:top-24">
          <p class="label">Guest preview</p>
          <div class="card overflow-hidden">
            <div class="arch-sm h-56 m-3 mb-0"><img class="img-cover" data-bound-img="type" src="https://images.unsplash.com/photo-1611892440504-42a792e24d32?auto=format&fit=crop&w=700&q=80" alt="Room preview"></div>
            <div class="p-5">
              <p class="text-xs tracking-[.2em] uppercase text-brass font-bold">Room <span data-bound="roomNo" data-empty="···">···</span></p>
              <h3 class="font-display text-3xl font-semibold text-forest mt-1" data-bound="type">Deluxe Room</h3>
              <p class="text-sm text-muted mt-2 flex items-center gap-1.5"><i data-lucide="users" class="w-4 h-4"></i>Up to <span data-bound="capacity">3</span> guests</p>
              <p class="mt-4"><span class="font-display text-2xl font-semibold text-forest" data-bound="rate" data-format="lkr">LKR 28,000</span> <span class="text-sm text-muted">/ night</span></p>
            </div>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <script src="../../js/layout.js"></script>
  <script src="../../js/app.js"></script>
</body>
</html>
