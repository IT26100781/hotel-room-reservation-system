<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Staff sign in · The Orchid Estate</title><link rel="stylesheet" href="/css/theme.css"><script src="/js/api.js" defer></script><script src="/js/login.js" defer></script></head>
<body class="login-page"><main class="login-card card card-pad"><span class="eyebrow">The Orchid Estate</span><h1 class="font-display">Welcome back.</h1><p class="text-muted">Sign in to manage payments and billing.</p>
<div id="message" class="message" role="alert"></div><form id="login-form">
<label for="username">Username</label><input class="input" id="username" autocomplete="username" required>
